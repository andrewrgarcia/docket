# cargo-make. Cross-platform on purpose: no GNU make, no shell scripts.
#
# `makers ci` is what CI runs: tests on the things that can break, lints for
# the things that can bite. Formatting is available as `makers fmt` but is
# never a gate — rustfmt reflows code that was laid out deliberately, and a
# style disagreement is not a broken build.

[config]
default_to_workspace = false

[tasks.test]
command = "cargo"
args = ["test", "--all-targets"]

# Correctness and footguns only. Style and pedantry are off.
# Two passes: correctness everywhere, tests included.
[tasks.lint-all]
command = "cargo"
args = [
    "clippy", "--all-targets", "--",
    "-D", "clippy::correctness",
    "-D", "clippy::suspicious",
    "-A", "clippy::style",
    "-A", "clippy::pedantic",
    "-A", "clippy::complexity",
]

# Panics in shipped code only. A test panics to fail, so `--bins` leaves the
# tests out; indexing is not linted (the indices are the code's own).
[tasks.lint-bins]
command = "cargo"
args = [
    "clippy", "--bins", "--",
    "-W", "clippy::unwrap_used",
    "-W", "clippy::expect_used",
    "-A", "clippy::style",
    "-A", "clippy::pedantic",
    "-A", "clippy::complexity",
]

[tasks.lint]
dependencies = ["lint-all", "lint-bins"]

[tasks.build]
command = "cargo"
args = ["build", "--release"]

[tasks.ci]
dependencies = ["test", "lint", "build"]

# Opt-in, never automatic.
[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks.install]
command = "cargo"
args = ["install", "--path", ".", "--locked"]

[tasks.publish-dry]
command = "cargo"
args = ["publish", "--dry-run", "--locked"]
